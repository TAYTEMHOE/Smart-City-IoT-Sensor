services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: smartcity-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./backend/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: smart-city-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
  mongo-data:
